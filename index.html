<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱心祝福</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;overflow:hidden;height:100vh;}
.tip-box{
  position:absolute;
  width:150px;height:60px;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:"微软雅黑";font-size:16px;
  box-shadow:0 0 12px #0004;
}
</style>
</head>
<body>
<script>
const tips = ["按时吃饭","每天开心","出门记得带伞","身体不舒服记得吃药","老大生日快乐","嘴苦了多喝奶茶","少抽烟少喝酒","天凉了多穿衣服"]
const colors = ["pink","lightblue","lightgreen","lemonchiffon","hotpink","skyblue"]
const w = window.innerWidth;
const h = window.innerHeight;

//爱心参数方程生成坐标
function getHeartPoints(n){
  let pts=[];
  for(let i=0;i<n;i++){
    const th = i/n * 2*Math.PI;
    const x = 16*Math.sin(th)**3;
    const y = 13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th);
    let sx = w/2 + x*20 -50;
    let sy = h/2 - y*20 -80;
    sx = Math.max(0, Math.min(sx,w-150));
    sy = Math.max(0, Math.min(sy,h-60));
    pts.push({x:sx,y:sy})
  }
  return pts;
}

function createBox(x,y,text){
  const div = document.createElement("div");
  div.className="tip-box";
  div.style.left = x+"px";
  div.style.top = y+"px";
  div.style.background = colors[Math.floor(Math.random()*colors.length)];
  div.innerText = text;
  document.body.appendChild(div);
  return div;
}

(async function run(){
  const heartPts = getHeartPoints(100);
  let heartBoxes = [];
  //爱心轨迹弹窗
  for(let i=0;i<heartPts.length;i++){
    const p = heartPts[i];
    const txt = i===heartPts.length-1 ? "充实自己" : tips[Math.floor(Math.random()*tips.length)];
    heartBoxes.push(createBox(p.x,p.y,txt));
    await sleep(30);
  }
  await sleep(1000);
  //清除爱心
  heartBoxes.forEach(d=>d.remove());

  //随机大量卡片
  let randomBoxes=[]
  const total = Math.floor(w/150)*Math.floor(h/40)+50;
  for(let i=0;i<total;i++){
    const rx = Math.floor(Math.random()*(w-150));
    const ry = Math.floor(Math.random()*(h-60));
    const txt = tips[Math.floor(Math.random()*tips.length)];
    randomBoxes.push(createBox(rx,ry,txt));
    await sleep(5);
  }
  await sleep(10000);
  //逐个关闭
  for(let el of randomBoxes){
    el.remove();
    await sleep(1000 / randomBoxes.length);
  }
})()

function sleep(ms){
  return new Promise(res=>setTimeout(res,ms))
}
</script>
</body>
</html>
